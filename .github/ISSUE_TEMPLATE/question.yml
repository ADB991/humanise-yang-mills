name: Mathematical question or coordination decision
description: Raise an ambiguity, gap, disputed interpretation, or cross-task decision.
title: '[Question] '
body:
  - type: textarea
    id: question
    attributes:
      label: Question or proposed decision
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and affected work
      description: Cite source revision, declarations, exact reasoning, and affected issues or units. Distinguish findings from hypotheses.
    validations:
      required: true
  - type: textarea
    id: next
    attributes:
      label: Smallest useful next step
      description: Who or what could resolve this, and which tasks are blocked?
    validations:
      required: true
